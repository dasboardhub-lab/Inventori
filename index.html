<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Inventori Gudang & Ekspedisi</title>
  <style>
    :root {
      --navy: #0f172a;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-soft: #eff6ff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f1f5f9;
      --white: #ffffff;
      --green: #059669;
      --green-soft: #ecfdf5;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --amber: #d97706;
      --amber-soft: #fffbeb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 13px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .login-logo {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 14px;
    }
    .login-card h1 { margin: 0 0 6px; font-size: 22px; }
    .login-card p { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .app-shell {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      background: var(--navy);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 12px;
    }
    .brand-mark {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
    }
    .brand-title { color: #fff; font-weight: 700; font-size: 14px; }
    .brand-sub { color: #94a3b8; font-size: 11px; margin-top: 2px; }
    .nav-group { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #64748b; padding: 8px 10px 6px; }
    .nav-list { display: grid; gap: 4px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-btn.active { background: var(--blue); color: #fff; font-weight: 600; }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .user-box {
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .user-box-name { color: #fff; font-weight: 700; font-size: 12px; }
    .user-box-meta { color: #94a3b8; font-size: 11px; margin-top: 2px; }

    .content { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 62px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
    .menu-toggle {
      display: none;
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 18px;
    }
    .role-badge {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      background: var(--blue-soft);
      color: var(--blue);
    }
    .db-badge {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      background: var(--green-soft);
      color: var(--green);
    }
    .main { padding: 24px; max-width: 1440px; width: 100%; margin: 0 auto; }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-head h1 { margin: 0; font-size: 22px; }
    .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--blue-hover); }
    .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #f8fafc; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: #fecaca; }
    .btn-sm { padding: 5px 10px; font-size: 11px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi-card, .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .kpi-label { color: var(--muted); font-size: 11px; font-weight: 600; }
    .kpi-val { font-size: 24px; font-weight: 800; margin: 8px 0 4px; }
    .kpi-sub { font-size: 11px; color: var(--muted); }

    .card { margin-bottom: 20px; }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .card-title { margin: 0; font-size: 15px; font-weight: 700; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .input, .select {
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      background: #fff;
      outline: none;
      width: 100%;
    }
    .filters .input, .filters .select { width: auto; min-width: 180px; }
    .input:focus, .select:focus { border-color: var(--blue); }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      white-space: nowrap;
    }
    th { background: #f8fafc; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
    tbody tr:hover { background: #f8fafc; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-green { background: var(--green-soft); color: var(--green); }
    .badge-amber { background: var(--amber-soft); color: var(--amber); }
    .badge-red { background: var(--red-soft); color: var(--red); }
    .badge-blue { background: var(--blue-soft); color: var(--blue); }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal {
      background: #fff;
      width: min(780px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: grid; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 11px; font-weight: 700; color: var(--muted); }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    .alert-info {
      background: var(--amber-soft);
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 11px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.5;
    }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: var(--navy);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }
    .toast.show { opacity: 1; }
    #backdrop { display: none; }

    @media (max-width: 820px) {
      .app-shell { display: block; }
      .sidebar {
        position: fixed;
        left: 0; top: 0;
        width: 250px;
        transform: translateX(-100%);
        transition: .2s;
      }
      .sidebar.open { transform: translateX(0); }
      #backdrop.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 35;
      }
      .menu-toggle { display: inline-grid; place-items: center; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .main { padding: 14px; }
      .db-badge { display: none; }
    }
  </style>
</head>
<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL = "https://utpoqnynhdarqkodqolk.supabase.co";
const SUPABASE_KEY = "sb_publishable_2D5paEyCUGwLWw7qqBr7TA_vFVcgyAQ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  items: [],
  branches: [],
  users: [],
  shipments: [],
  inbounds: [],
  opnames: [],
  dbReady: true,
  dbError: ""
};

let currentUser = JSON.parse(sessionStorage.getItem("INV_USER") || "null");
let currentPage = "dashboard";
let stagedExcelShipments = [];

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3200);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function num(n) {
  return new Intl.NumberFormat("id-ID").format(Number(n || 0));
}

function canEditGudang() {
  return currentUser && (currentUser.status === "ADMIN" || currentUser.status === "STAFF_GUDANG");
}
function isAdmin() {
  return currentUser && currentUser.status === "ADMIN";
}
function isVisitor() {
  return currentUser && currentUser.status === "VISITOR";
}

async function fetchAllData() {
  try {
    const [itemsRes, branchRes, userRes, shipRes, lineRes, inbRes, opnRes] = await Promise.all([
      sb.from("items").select("*").order("id", { ascending: true }),
      sb.from("branches").select("*").order("hub", { ascending: true }).order("staging", { ascending: true }),
      sb.from("app_users").select("*").order("id", { ascending: true }),
      sb.from("shipments").select("*").order("id", { ascending: false }),
      sb.from("shipment_lines").select("*").order("id", { ascending: true }),
      sb.from("inbounds").select("*").order("id", { ascending: false }),
      sb.from("opnames").select("*").order("id", { ascending: false })
    ]);

    if (itemsRes.error) throw itemsRes.error;

    const linesByShip = {};
    (lineRes.data || []).forEach(l => {
      if (!linesByShip[l.shipment_id]) linesByShip[l.shipment_id] = [];
      linesByShip[l.shipment_id].push(l);
    });

    state.items = itemsRes.data || [];
    state.branches = branchRes.data || [];
    state.users = userRes.data || [];
    state.shipments = (shipRes.data || []).map(s => ({
      ...s,
      lines: linesByShip[s.id] || []
    }));
    state.inbounds = inbRes.data || [];
    state.opnames = opnRes.data || [];
    state.dbReady = true;
    state.dbError = "";
  } catch (err) {
    state.dbReady = false;
    state.dbError = err.message || "Tabel database belum dibuat di Supabase.";
  }
}

function generateNextSjNo() {
  const year = new Date().getFullYear();
  const prefix = `SJ/${year}/`;
  let maxNum = 0;
  state.shipments.forEach(s => {
    if (s.sj_no && s.sj_no.startsWith(prefix)) {
      const n = parseInt(s.sj_no.replace(prefix, ""), 10);
      if (n > maxNum) maxNum = n;
    }
  });
  return `${prefix}${String(maxNum + 1).padStart(4, "0")}`;
}

/* RENDER LOGIN */
function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">G</div>
        <h1>Login Sistem Inventori</h1>
        <p>Gudang Pusat & Distribusi Ekspedisi (Cloud Database Aktif)</p>
        ${!state.dbReady ? `
          <div class="alert-info" style="color:var(--red)">
            <strong>Database Supabase Belum Siap:</strong><br>${esc(state.dbError)}<br>
            Pastikan Anda sudah menjalankan Script SQL di menu <strong>SQL Editor</strong> Supabase.
          </div>
        ` : ""}
        <form id="loginForm" style="display:grid;gap:12px">
          <div class="form-group">
            <label>NIK (Angka)</label>
            <input class="input" id="loginNik" type="text" inputmode="numeric" placeholder="Contoh: 10001596" required>
          </div>
          <div class="form-group">
            <label>Password (Min. 3 Angka)</label>
            <input class="input" id="loginPass" type="password" inputmode="numeric" minlength="3" placeholder="•••" required>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;padding:11px">Masuk</button>
        </form>
        <div style="margin-top:16px;padding:12px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--muted)">
          <strong>Akun Awal Database:</strong><br>
          • Admin: NIK <code>10001596</code> | Pass: <code>123</code><br>
          • Staff Gudang: NIK <code>10001597</code> | Pass: <code>123</code><br>
          • Cabang (BJM-LKTU0): NIK <code>10001598</code> | Pass: <code>123</code><br>
          • Visitor: NIK <code>10001599</code> | Pass: <code>123</code>
        </div>
      </div>
    </div>
  `;
}

/* RENDER MAIN APP */
function renderApp() {
  if (!currentUser) {
    renderLogin();
    return;
  }

  const navItems = [
    { id: "dashboard", label: "Ringkasan", icon: "▦" },
    { id: "inventory", label: "Barang & Stok Gudang", icon: "▣" },
    { id: "shipments", label: "Pengiriman & Cabang", icon: "⇄" },
    { id: "incoming", label: "Barang Masuk", icon: "⇩" },
    { id: "opname", label: "Stock Opname", icon: "☷" },
    { id: "reports", label: "Laporan & Selisih", icon: "▤" },
    { id: "branches", label: "Master HUB & Staging", icon: "⌖" },
    { id: "users", label: "Kelola Pengguna", icon: "♙" }
  ];

  const navHtml = navItems.map(item => `
    <button class="nav-btn ${currentPage === item.id ? "active" : ""}" data-nav="${item.id}">
      <span>${item.icon}</span> ${item.label}
    </button>
  `).join("");

  document.getElementById("app").innerHTML = `
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">G</div>
          <div>
            <div class="brand-title">Gudang & Ekspedisi</div>
            <div class="brand-sub">Supabase Cloud Aktif</div>
          </div>
        </div>
        <div class="nav-group">MENU UTAMA</div>
        <nav class="nav-list">${navHtml}</nav>
        <div class="sidebar-footer">
          <div class="user-box">
            <div class="user-box-name">${esc(currentUser.nama)}</div>
            <div class="user-box-meta">NIK: ${esc(currentUser.nik)} · ${esc(currentUser.lokasi)}</div>
          </div>
          <button class="btn btn-secondary" style="width:100%" data-action="logout">Keluar</button>
        </div>
      </aside>
      <div id="backdrop"></div>
      <div class="content">
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-toggle" id="menuBtn">☰</button>
            <strong>${esc(navItems.find(n => n.id === currentPage)?.label || "Dashboard")}</strong>
          </div>
          <div class="topbar-right">
            <span class="db-badge">● Cloud Database Terhubung</span>
            <span class="role-badge">${esc(currentUser.status)} (${esc(currentUser.lokasi)})</span>
            <button class="btn btn-secondary btn-sm" data-action="refresh-data">↻ Refresh</button>
          </div>
        </header>
        <main class="main" id="mainView"></main>
      </div>
    </div>
  `;

  renderPageContent();
}

function getVisibleShipments() {
  if (currentUser.status === "CABANG") {
    const parts = currentUser.lokasi.split("-").map(s => s.trim().toUpperCase());
    const stg = parts[1] || parts[0];
    return state.shipments.filter(s =>
      s.staging.toUpperCase() === stg ||
      `${s.hub} - ${s.staging}`.toUpperCase() === currentUser.lokasi.toUpperCase()
    );
  }
  return state.shipments;
}

function renderPageContent() {
  const view = document.getElementById("mainView");
  if (!view) return;
  if (currentPage === "dashboard") view.innerHTML = viewDashboard();
  else if (currentPage === "inventory") view.innerHTML = viewInventory();
  else if (currentPage === "shipments") view.innerHTML = viewShipments();
  else if (currentPage === "incoming") view.innerHTML = viewIncoming();
  else if (currentPage === "opname") view.innerHTML = viewOpname();
  else if (currentPage === "reports") view.innerHTML = viewReports();
  else if (currentPage === "branches") view.innerHTML = viewBranches();
  else if (currentPage === "users") view.innerHTML = viewUsers();
}

/* 1. DASHBOARD */
function viewDashboard() {
  const lowItems = state.items.filter(i => i.stock <= i.min_stock);
  const totalStock = state.items.reduce((a, b) => a + b.stock, 0);
  const myShipments = getVisibleShipments();
  const pendingShipments = myShipments.filter(s => s.status === "Dalam Perjalanan");

  return `
    <div class="page-head">
      <div>
        <h1>Halo, ${esc(currentUser.nama)}</h1>
        <p>Akses: <strong>${esc(currentUser.status)}</strong> · Lokasi: <strong>${esc(currentUser.lokasi)}</strong></p>
      </div>
      <div class="btn-group">
        ${canEditGudang() ? `
          <button class="btn btn-secondary" data-action="open-import">⇧ Upload Excel Bulky</button>
          <button class="btn btn-primary" data-action="open-shipment">＋ Buat Pengiriman</button>
        ` : ""}
      </div>
    </div>

    ${isVisitor() ? `<div class="alert-info">Mode <strong>VISITOR</strong>: Anda hanya dapat melihat dan memfilter data tanpa dapat mengubah data apapun.</div>` : ""}

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Jenis Barang</div>
        <div class="kpi-val">${num(state.items.length)}</div>
        <div class="kpi-sub">Terdaftar di Gudang Pusat</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Unit di Gudang</div>
        <div class="kpi-val">${num(totalStock)}</div>
        <div class="kpi-sub">Stok real-time Gudang</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Stok Menipis</div>
        <div class="kpi-val" style="color:var(--red)">${num(lowItems.length)}</div>
        <div class="kpi-sub">Perlu segera restock</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Kiriman Dalam Perjalanan</div>
        <div class="kpi-val" style="color:var(--blue)">${num(pendingShipments.length)}</div>
        <div class="kpi-sub">Menunggu konfirmasi cabang</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 class="card-title">Peringatan Stok Menipis di Gudang Pusat</h2>
        <button class="btn btn-secondary btn-sm" data-nav="inventory">Kelola Stok</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama Barang</th><th>Stok Gudang</th><th>Batas Minimum</th><th>Satuan</th><th>Status</th></tr></thead>
          <tbody>
            ${lowItems.length ? lowItems.map(i => `
              <tr>
                <td><strong>${esc(i.name)}</strong></td>
                <td><strong>${num(i.stock)}</strong></td>

function renderShipmentTable(list) {
  return `
    <div class="table-wrap">
      <table id="shipTable">
        <thead>
          <tr>
            <th>No. Surat Jalan</th>
            <th>Tanggal</th>
            <th>HUB</th>
            <th>STAGING</th>
            <th>Resi / AWB</th>
            <th>Barang</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          ${list.length ? list.map(s => {
            const totalSent = s.lines.reduce((a, b) => a + b.sent_qty, 0);
            const badge = s.status === "Diterima Sesuai" ? "badge-green" : (s.status === "Diterima Selisih" ? "badge-red" : "badge-blue");
            const canConfirm = !isVisitor() && (currentUser.status === "CABANG" || canEditGudang());
            return `
              <tr>
                <td><strong>${esc(s.sj_no)}</strong></td>
                <td>${esc(s.ship_date)}</td>
                <td><strong>${esc(s.hub)}</strong></td>
                <td>${esc(s.staging)}</td>
                <td>${esc(s.resi || "-")}</td>
                <td>${s.lines.length} item (${num(totalSent)} unit)</td>
                <td><span class="badge ${badge}">${esc(s.status)}</span></td>
                <td>
                  <button class="btn btn-secondary btn-sm" data-action="print-sj" data-id="${s.id}">🖨 Cetak SJ</button>
                  ${canConfirm ? `<button class="btn btn-primary btn-sm" data-action="confirm-sj" data-id="${s.id}">✓ Input Actual</button>` : ""}
                </td>
              </tr>
            `;
          }).join("") : `<tr><td colspan="8">Belum ada data pengiriman.</td></tr>`}

      </table>
    </div>
  `;
}

function viewReports() {
  const flatRows = [];
  getVisibleShipments().forEach(s => {

      flatRows.push({

  return `

window.filterTable = function(tableId, q) {
  const query = (q || "").toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(query) ? "" : "none";
  });
};

          <div class="form-group"><label>Kode HUB (Contoh: BJM)</label><input class="input" name="hub" required></div>
          <div class="form-group"><label>Kode STAGING (Contoh: LKTU0)</label><input class="input" name="staging" required></div>
          <div class="modal-foot full">
            <button type="button" class="btn btn-secondary" data-action="close-modal">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan Cabang</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

/* EXCEL BULK UPLOAD */
function openImportModal() {
  stagedExcelShipments = [];
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-bg">
      <div class="modal">
        <div class="modal-head"><h2>Upload Excel Pengiriman Bulky ke Cabang</h2><button class="btn btn-secondary btn-sm" data-action="close-modal">✕</button></div>
        <p style="color:var(--muted);margin-top:0">Format kolom: <strong>HUB | STAGING | 18 Kolom Barang</strong>. Setiap baris cabang yang memiliki angka pengiriman &gt; 0 akan otomatis dibuatkan Surat Jalan dan memotong stok gudang di Supabase.</p>
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          <button type="button" class="btn btn-secondary btn-sm" data-action="dl-template">⬇ Unduh Template Excel (.xlsx)</button>
          <input class="input" type="file" id="excelInput" accept=".xlsx,.xls,.csv" style="max-width:320px">
        </div>
        <div id="excelPreview"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-secondary" data-action="close-modal">Tutup</button>
          <button type="button" class="btn btn-primary" id="btnProcessExcel" data-action="commit-excel" disabled>Proses & Simpan ke Database</button>
        </div>
      </div>
    </div>
  `;
}

function downloadTemplateExcel() {
  const headers = ["HUB", "STAGING", ...state.items.map(i => i.name)];
  const rows = state.branches.map(b => [b.hub, b.staging, ...state.items.map(() => 0)]);
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Distribusi_Cabang");
  XLSX.writeFile(wb, "Template_Pengiriman_Bulky_Cabang.xlsx");
}

function exportReportExcel() {
  const data = [["No. Surat Jalan", "Tanggal", "HUB", "STAGING", "Nama Barang", "Jumlah Dikirim", "Actual Diterima", "Selisih", "Status"]];
  getVisibleShipments().forEach(s => {
    s.lines.forEach(l => {
      const diff = l.actual_qty !== null ? (l.actual_qty - l.sent_qty) : "";
      data.push([s.sj_no, s.ship_date, s.hub, s.staging, l.item_name, l.sent_qty, l.actual_qty ?? "", diff, s.status]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Laporan_Pengiriman");
  XLSX.writeFile(wb, "Laporan_Pengiriman_Cabang.xlsx");
}

async function handleExcelUpload(file) {
  if (!file) return;
  const preview = document.getElementById("excelPreview");
  preview.innerHTML = "Membaca file Excel...";
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: 0 });
    if (rows.length < 2) throw new Error("File kosong.");

    const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
    const headers = rows[0].map(norm);
    const hubIdx = headers.indexOf("hub");
    const stgIdx = headers.indexOf("staging");
    if (hubIdx === -1 || stgIdx === -1) throw new Error("Kolom HUB dan STAGING wajib ada di baris pertama.");

    stagedExcelShipments = [];
    rows.slice(1).forEach(r => {
      const hub = String(r[hubIdx] || "").trim().toUpperCase();
      const staging = String(r[stgIdx] || "").trim().toUpperCase();
      if (!hub || !staging) return;
      const lines = [];
      state.items.forEach(item => {
        const col = headers.indexOf(norm(item.name));
        if (col !== -1) {
          const val = parseInt(r[col], 10);
          if (val > 0) lines.push({ item_name: item.name, sent_qty: val });
        }
      });
      if (lines.length > 0) stagedExcelShipments.push({ hub, staging, lines });
    });

    preview.innerHTML = `
      <div class="alert-info">
        Terbaca <strong>${stagedExcelShipments.length} cabang tujuan</strong> yang memiliki pengiriman (&gt; 0).
        Klik tombol <strong>Proses & Simpan ke Database</strong> untuk membuat Surat Jalan otomatis.
      </div>
    `;
    document.getElementById("btnProcessExcel").disabled = stagedExcelShipments.length === 0;
  } catch (err) {
    preview.innerHTML = `<div class="alert-info" style="color:var(--red)">Gagal membaca file: ${esc(err.message)}</div>`;
  }
}

function printSjWindow(shipId) {
  const sj = state.shipments.find(s => s.id === Number(shipId));
  if (!sj) return;
  const w = window.open("", "_blank", "width=820,height=650");
  if (!w) return showToast("Izinkan pop-up browser untuk mencetak Surat Jalan.");
  w.document.write(`
    <!doctype html><html><head><title>${esc(sj.sj_no)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#111;font-size:12px}
      .top{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:16px}
      table{width:100%;border-collapse:collapse;margin-top:14px}
      th,td{border:1px solid #888;padding:8px;text-align:left}
      .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:60px;text-align:center}
      .sign div{border-top:1px solid #333;padding-top:6px}
    </style></head><body>
      <div class="top">
        <div><strong>GUDANG PUSAT & DISTRIBUSI EKSPEDISI</strong><br>No. Surat Jalan: <strong>${esc(sj.sj_no)}</strong></div>
        <div style="text-align:right"><strong>SURAT JALAN</strong><br>Tanggal: ${esc(sj.ship_date)}</div>
      </div>
      <p><strong>Tujuan HUB:</strong> ${esc(sj.hub)} &nbsp;|&nbsp; <strong>STAGING (Cabang):</strong> ${esc(sj.staging)} &nbsp;|&nbsp; <strong>Resi/AWB:</strong> ${esc(sj.resi || "-")}</p>
      <table>
        <thead><tr><th>Nama Barang</th><th>Jumlah Dikirim</th><th>Actual Diterima</th></tr></thead>
        <tbody>
          ${sj.lines.map(l => `<tr><td>${esc(l.item_name)}</td><td>${num(l.sent_qty)}</td><td>${l.actual_qty !== null ? num(l.actual_qty) : "........"}</td></tr>`).join("")}
        </tbody>
      </table>
      <div class="sign"><div>Disiapkan Gudang (${esc(sj.created_by || "Admin")})</div><div>Kurir / Pengirim</div><div>Penerima Cabang (${esc(sj.staging)})</div></div>
      <script>setTimeout(()=>window.print(),300)<\/script>
    </body></html>
  `);
  w.document.close();
}

/* EVENT LISTENERS */
document.addEventListener("click", async e => {
  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) {
    currentPage = navBtn.dataset.nav;
    renderApp();
    return;
  }

  if (e.target.id === "menuBtn" || e.target.id === "backdrop") {
    document.getElementById("sidebar")?.classList.toggle("open");
    document.getElementById("backdrop")?.classList.toggle("show");
    return;
  }

  const actBtn = e.target.closest("[data-action]");
  if (!actBtn) return;
  const act = actBtn.dataset.action;

  if (act === "logout") {
    currentUser = null;
    sessionStorage.removeItem("INV_USER");
    renderApp();
  }
  if (act === "refresh-data") {
    showToast("Memuat data terbaru dari Supabase...");
    await fetchAllData();
    renderApp();
  }
  if (act === "close-modal") closeModal();
  if (act === "open-inbound") openInboundModal();
  if (act === "open-opname") openOpnameModal();
  if (act === "open-shipment") openShipmentModal();
  if (act === "open-import") openImportModal();
  if (act === "open-user") openUserModal();
  if (act === "open-branch") openBranchModal();
  if (act === "open-add-item") openAddItemModal();
  if (act === "edit-item") openEditItemModal(actBtn.dataset.id);
  if (act === "dl-template") downloadTemplateExcel();
  if (act === "export-report") exportReportExcel();
  if (act === "print-sj") printSjWindow(actBtn.dataset.id);
  if (act === "confirm-sj") openConfirmModal(actBtn.dataset.id);

  if (act === "del-user") {
    if (confirm("Hapus user ini?")) {
      await sb.from("app_users").delete().eq("id", Number(actBtn.dataset.id));
      await fetchAllData(); renderPageContent();
      showToast("User dihapus.");
    }
  }
  if (act === "del-branch") {
    if (confirm("Hapus cabang ini?")) {
      await sb.from("branches").delete().eq("id", Number(actBtn.dataset.id));
      await fetchAllData(); renderPageContent();
      showToast("Cabang dihapus.");
    }
  }

  if (act === "commit-excel") {
    const btn = document.getElementById("btnProcessExcel");
    btn.disabled = true;
    btn.textContent = "Menyimpan ke Database...";
    try {
      const today = new Date().toISOString().slice(0, 10);
      let seq = state.shipments.length + 1;
      const year = new Date().getFullYear();

      for (const entry of stagedExcelShipments) {
        const sj_no = `SJ/${year}/${String(seq++).padStart(4, "0")}`;
        const { data: shipRow, error: shipErr } = await sb.from("shipments").insert({
          sj_no, ship_date: today, hub: entry.hub, staging: entry.staging,
          resi: "", status: "Dalam Perjalanan", created_by: currentUser.nama
        }).select().single();
        if (shipErr) throw shipErr;

        const linePayloads = entry.lines.map(l => ({
          shipment_id: shipRow.id, item_name: l.item_name, sent_qty: l.sent_qty, actual_qty: null
        }));
        await sb.from("shipment_lines").insert(linePayloads);

        for (const l of entry.lines) {
          const item = state.items.find(i => i.name === l.item_name);
          if (item) {
            const newStock = Math.max(0, item.stock - l.sent_qty);
            item.stock = newStock;
            await sb.from("items").update({ stock: newStock }).eq("id", item.id);
          }
        }
      }
      await fetchAllData();
      closeModal();
      renderPageContent();
      showToast(`${stagedExcelShipments.length} Surat Jalan berhasil disimpan ke Supabase!`);
    } catch (err) {
      showToast("Gagal menyimpan: " + err.message);
      btn.disabled = false;
      btn.textContent = "Proses & Simpan ke Database";
    }
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "excelInput") handleExcelUpload(e.target.files[0]);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;

  if (f.id === "loginForm") {
    const nik = document.getElementById("loginNik").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    const user = state.users.find(u => u.nik === nik && u.pass === pass);
    if (!user) return showToast("NIK atau Password tidak ditemukan!");
    currentUser = user;
    sessionStorage.setItem("INV_USER", JSON.stringify(user));
    currentPage = user.status === "CABANG" ? "shipments" : "dashboard";
    renderApp();
    showToast(`Selamat datang, ${user.nama}`);
  }

  if (f.id === "inboundForm") {
    const item_name = f.item.value;
    const qty = parseInt(f.qty.value, 10);
    const note = f.note.value.trim();
    const prod = state.items.find(i => i.name === item_name);
    if (prod) {
      await sb.from("items").update({ stock: prod.stock + qty }).eq("id", prod.id);
      await sb.from("inbounds").insert({ item_name, qty, note, created_by: currentUser.nama });
      await fetchAllData(); closeModal(); renderPageContent();
      showToast("Barang masuk berhasil disimpan ke Supabase.");
    }
  }

  if (f.id === "opnameForm") {
    const item_name = f.item.value;
    const phys_qty = parseInt(f.phys.value, 10);
    const note = f.note.value.trim();
    const prod = state.items.find(i => i.name === item_name);
    if (prod) {
      const sys_qty = prod.stock;
      const diff_qty = phys_qty - sys_qty;
      await sb.from("items").update({ stock: phys_qty }).eq("id", prod.id);
      await sb.from("opnames").insert({ item_name, sys_qty, phys_qty, diff_qty, note, created_by: currentUser.nama });
      await fetchAllData(); closeModal(); renderPageContent();
      showToast("Stock opname berhasil disimpan ke Supabase.");
    }
  }

  if (f.id === "shipForm") {
    const [hub, staging] = f.dest.value.split("|");
    const lines = [{ item_name: f.item1.value, sent_qty: parseInt(f.qty1.value, 10) }];
    if (f.item2.value && parseInt(f.qty2.value, 10) > 0) {
      lines.push({ item_name: f.item2.value, sent_qty: parseInt(f.qty2.value, 10) });
    }
    for (const l of lines) {
      const p = state.items.find(i => i.name === l.item_name);
      if (!p || p.stock < l.sent_qty) return showToast(`Stok ${l.item_name} tidak mencukupi!`);
    }
    const sj_no = generateNextSjNo();
    const { data: shipRow, error } = await sb.from("shipments").insert({
      sj_no, hub, staging, resi: f.resi.value.trim(), status: "Dalam Perjalanan", created_by: currentUser.nama
    }).select().single();
    if (error) return showToast("Gagal: " + error.message);

    await sb.from("shipment_lines").insert(lines.map(l => ({
      shipment_id: shipRow.id, item_name: l.item_name, sent_qty: l.sent_qty, actual_qty: null
    })));

    for (const l of lines) {
      const p = state.items.find(i => i.name === l.item_name);
      await sb.from("items").update({ stock: p.stock - l.sent_qty }).eq("id", p.id);
    }
    await fetchAllData(); closeModal(); renderPageContent();
    showToast(`Surat Jalan ${sj_no} berhasil dibuat!`);
  }

  if (f.id === "confirmForm") {
    const shipId = Number(f.dataset.id);
    const sj = state.shipments.find(s => s.id === shipId);
    if (sj) {
      let hasDiff = false;
      for (const l of sj.lines) {
        const val = parseInt(f[`line_${l.id}`].value, 10);
        if (val !== l.sent_qty) hasDiff = true;
        await sb.from("shipment_lines").update({ actual_qty: val }).eq("id", l.id);
      }
      const status = hasDiff ? "Diterima Selisih" : "Diterima Sesuai";
      await sb.from("shipments").update({ status, received_by: currentUser.nama, received_at: new Date().toISOString() }).eq("id", shipId);
      await fetchAllData(); closeModal(); renderPageContent();
      showToast(`Penerimaan ${sj.sj_no} berhasil disimpan ke Supabase!`);
    }
  }

  if (f.id === "editItemForm") {
    await sb.from("items").update({
      name: f.name.value.trim(),
      unit: f.unit.value.trim(),
      min_stock: parseInt(f.min_stock.value, 10)
    }).eq("id", Number(f.dataset.id));
    await fetchAllData(); closeModal(); renderPageContent();
    showToast("Data barang diperbarui.");
  }

  if (f.id === "addItemForm") {
    await sb.from("items").insert({
      name: f.name.value.trim(),
      stock: parseInt(f.stock.value, 10),
      min_stock: parseInt(f.min_stock.value, 10),
      unit: f.unit.value.trim()
    });
    await fetchAllData(); closeModal(); renderPageContent();
    showToast("Master barang ditambahkan.");
  }

  if (f.id === "userForm") {
    const { error } = await sb.from("app_users").insert({
      nama: f.nama.value.trim(),
      nik: f.nik.value.trim(),
      pass: f.pass.value.trim(),
      lokasi: f.lokasi.value,
      status: f.status.value
    });
    if (error) return showToast("Gagal: NIK sudah terdaftar.");
    await fetchAllData(); closeModal(); renderPageContent();
    showToast("User baru berhasil disimpan.");
  }

  if (f.id === "branchForm") {
    await sb.from("branches").insert({
      hub: f.hub.value.trim().toUpperCase(),
      staging: f.staging.value.trim().toUpperCase()
    });
    await fetchAllData(); closeModal(); renderPageContent();
    showToast("Cabang berhasil ditambahkan.");
  }
});

(async function init() {
  await fetchAllData();
  renderApp();
})();
</script>
