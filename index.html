<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Gudang</title>

  <style>
    :root {
      --navy: #15243b;
      --navy-soft: #213652;
      --blue: #4169e1;
      --blue-light: #edf2ff;
      --text: #1d2939;
      --muted: #667085;
      --border: #e6eaf0;
      --bg: #f6f8fb;
      --white: #fff;
      --green: #16845b;
      --green-light: #e7f6ef;
      --red: #c33d48;
      --red-light: #fff0f0;
      --amber: #a86609;
      --amber-light: #fff5df;
      --shadow: 0 8px 26px rgba(25, 39, 67, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 22px 15px 16px;
      color: #d8e1ef;
      background: var(--navy);
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 3px 10px 25px;
    }

    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: var(--blue);
      font-weight: 800;
      font-size: 19px;
    }

    .brand-title { color: #fff; font-weight: 750; font-size: 14px; }
    .brand-subtitle { margin-top: 3px; color: #9fb0c8; font-size: 11px; }

    .nav-label {
      padding: 11px 11px 8px;
      color: #8193ad;
      font-size: 10px;
      letter-spacing: .12em;
      font-weight: 750;
    }

    .nav-list {
      display: grid;
      gap: 4px;
      margin-bottom: 14px;
    }

    .nav-link {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 10px 11px;
      color: #c2ccda;
      background: transparent;
      border: 0;
      border-radius: 9px;
      text-align: left;
      font-size: 13px;
      transition: .16s ease;
    }

    .nav-link:hover { color: #fff; background: rgba(255,255,255,.07); }
    .nav-link.active { color: #fff; background: #2b4265; }
    .nav-icon { width: 20px; text-align: center; font-size: 17px; }

    .sidebar-bottom { margin-top: auto; }

    .warehouse-card {
      padding: 13px 12px;
      margin: 14px 3px 0;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 11px;
      background: rgba(255,255,255,.04);
    }

    .warehouse-row { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 12px; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #47ce91; }
    .warehouse-small { margin: 6px 0 0 16px; color: #9fb0c8; font-size: 11px; }

    .content { min-width: 0; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
    }

    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 14px; }
    .breadcrumbs { color: var(--muted); font-size: 12px; }
    .breadcrumbs strong { color: var(--text); font-size: 13px; }
    .topbar-right { gap: 12px; }

    .search-box {
      display: flex;
      width: min(300px, 32vw);
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fbfcfe;
      color: #98a2b3;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 12px;
    }

    .demo-pill {
      padding: 5px 8px;
      color: #7a5100;
      background: #fff2ce;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .avatar {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      color: #355ac6;
      background: #e9efff;
      font-size: 11px;
      font-weight: 800;
    }

    .user-name { color: #344054; font-size: 12px; font-weight: 650; white-space: nowrap; }

    .menu-toggle {
      display: none;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      background: #fff;
      font-size: 19px;
    }

    .main {
      width: min(1480px, 100%);
      padding: 30px 34px 42px;
      margin: 0 auto;
    }

    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 10px;
      letter-spacing: .12em;
      font-weight: 800;
    }

    h1 { margin: 0; color: var(--text); font-size: 26px; letter-spacing: -.035em; }
    .page-subtitle { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

    .actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      transition: .16s ease;
    }

    .btn-primary { color: #fff; background: var(--blue); }
    .btn-primary:hover { background: #3156c5; }
    .btn-secondary { color: #344054; border-color: var(--border); background: #fff; }
    .btn-secondary:hover { background: #f8f9fc; }
    .btn-small { min-height: 32px; padding: 0 10px; font-size: 11px; }
    .btn-danger { color: var(--red); border-color: #f3d0d2; background: #fff; }

    .demo-alert {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 11px 13px;
      margin-bottom: 18px;
      border: 1px solid #f2dfaa;
      border-radius: 9px;
      color: #76530d;
      background: #fffaf0;
      font-size: 11px;
      line-height: 1.5;
    }

    .demo-alert strong { color: #674600; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat-card, .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .stat-card { min-height: 137px; padding: 16px; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 650; }
    .stat-icon {
      display: grid;
      width: 33px;
      height: 33px;
      place-items: center;
      border-radius: 9px;
      font-size: 16px;
    }

    .stat-value { margin-top: 13px; font-size: 25px; font-weight: 780; letter-spacing: -.04em; }
    .stat-note { margin-top: 5px; color: #8a94a4; font-size: 10px; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, .85fr);
      gap: 15px;
      margin-bottom: 16px;
    }

    .card { min-width: 0; padding: 18px; }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .card-title { margin: 0; font-size: 14px; font-weight: 750; }
    .card-description { margin: 5px 0 0; color: var(--muted); font-size: 11px; }

    .chart-plot {
      display: flex;
      height: 190px;
      align-items: stretch;
      gap: 10px;
      padding: 12px 4px 0;
      border-bottom: 1px solid var(--border);
    }

    .bar-column {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .bar {
      width: min(32px, 65%);
      min-height: 7px;
      border-radius: 7px 7px 2px 2px;
      background: #cbd7fb;
    }

    .bar.today { background: linear-gradient(180deg, #6385ef, #4169e1); }
    .bar-label { padding-bottom: 9px; color: #8791a1; font-size: 10px; }

    .chart-legend { display: flex; align-items: center; gap: 7px; margin-top: 12px; color: var(--muted); font-size: 10px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }

    .stock-list { display: grid; gap: 13px; }
    .stock-item-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stock-name { overflow: hidden; color: #344054; font-size: 11px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .stock-amount { color: var(--red); font-size: 10px; font-weight: 750; white-space: nowrap; }
    .stock-min { margin-top: 4px; color: #98a2b3; font-size: 10px; }
    .progress-track { height: 5px; margin-top: 8px; overflow: hidden; border-radius: 5px; background: #f0f1f4; }
    .progress-fill { height: 100%; border-radius: inherit; background: #e06b72; }

    .table-card { padding: 0; overflow: hidden; }
    .table-card-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 18px; }
    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      padding: 11px 15px;
      border-top: 1px solid #edf0f4;
      border-bottom: 1px solid #edf0f4;
      color: #778194;
      background: #fafbfd;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid #f0f2f5;
      color: #475467;
      font-size: 11px;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfcff; }
    .table-primary { color: #27364a; font-weight: 700; }
    .table-muted { display: block; margin-top: 3px; color: #98a2b3; font-size: 10px; }
    .number-cell { font-variant-numeric: tabular-nums; font-weight: 650; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 750;
      white-space: nowrap;
    }

    .status-badge::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
    .status-success { color: var(--green); background: var(--green-light); }
    .status-info { color: #355ac6; background: #edf2ff; }
    .status-warning { color: var(--amber); background: var(--amber-light); }
    .empty-note { padding: 22px 15px; color: var(--muted); text-align: center; font-size: 12px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 13px 16px;
      border-top: 1px solid #edf0f4;
      border-bottom: 1px solid #edf0f4;
      background: #fff;
    }

    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-select, .field-input, .field-select {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      color: #344054;
      background: #fff;
      font-size: 11px;
    }

    .filter-select:focus, .field-input:focus, .field-select:focus { border-color: #9bb0f3; box-shadow: 0 0 0 3px #edf2ff; }

    .page-count { color: #8791a1; font-size: 10px; }

    .module-card {
      display: grid;
      min-height: 360px;
      place-items: center;
      padding: 30px;
      text-align: center;
    }

    .module-icon {
      display: grid;
      width: 56px;
      height: 56px;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 16px;
      color: var(--blue);
      background: var(--blue-light);
      font-size: 25px;
    }

    .module-card h2 { margin: 0; font-size: 18px; }
    .module-card p { max-width: 490px; margin: 9px auto 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(13, 24, 42, .48);
    }

    .modal {
      width: min(700px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 22px 70px rgba(10, 20, 35, .22);
    }

    .modal.modal-wide { width: min(840px, 100%); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .modal-close {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #667085;
      background: #fff;
      font-size: 18px;
    }

    .modal-copy { margin: 0 0 15px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }

    .drop-zone {
      display: grid;
      min-height: 126px;
      place-items: center;
      padding: 18px;
      border: 1px dashed #aab9e8;
      border-radius: 11px;
      color: #44516a;
      background: #fafbff;
      text-align: center;
      cursor: pointer;
    }

    .drop-zone:hover { border-color: var(--blue); background: #f4f6ff; }
    .drop-icon { margin-bottom: 6px; color: var(--blue); font-size: 24px; }
    .drop-zone strong { font-size: 12px; }
    .drop-zone small { margin-top: 5px; color: #8993a4; font-size: 10px; }
    .drop-zone input { display: none; }

    .template-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 15px; }
    .template-line span { color: var(--muted); font-size: 10px; }

    .import-result { margin-top: 13px; }
    .result-box { padding: 12px; border: 1px solid var(--border); border-radius: 9px; background: #fcfdff; }
    .result-title { color: #27364a; font-size: 12px; font-weight: 750; }
    .result-copy { margin: 5px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .warning-copy { margin-top: 7px; color: #9a5c00; font-size: 10px; line-height: 1.5; }
    .preview-table { margin-top: 10px; }
    .preview-table th, .preview-table td { padding: 8px 9px; font-size: 10px; }
    .preview-status-good { color: var(--green); font-weight: 750; }
    .preview-status-bad { color: var(--red); font-weight: 750; }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #475467; font-size: 10px; font-weight: 700; }
    .field-input, .field-select { width: 100%; min-height: 38px; }
    .line-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 17px 0 9px; }
    .line-heading strong { font-size: 12px; }
    .ship-lines { display: grid; gap: 8px; }
    .ship-line { display: grid; grid-template-columns: minmax(0, 1fr) 110px 34px; gap: 8px; }
    .ship-line select, .ship-line input {
      min-width: 0;
      height: 37px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: 0;
      color: #344054;
      background: #fff;
      font-size: 10px;
    }

    .remove-line {
      border: 1px solid #f1d6d7;
      border-radius: 8px;
      color: var(--red);
      background: #fff;
      font-size: 16px;
    }

    .form-error { min-height: 16px; margin-top: 8px; color: var(--red); font-size: 10px; }
    .prototype-note { margin-top: 12px; padding: 9px 10px; border-radius: 8px; color: #7a5100; background: #fff7e5; font-size: 10px; line-height: 1.5; }

    .waybill {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .waybill-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .waybill-label { color: var(--blue); font-size: 9px; font-weight: 800; letter-spacing: .12em; }
    .waybill-no { margin-top: 5px; font-size: 19px; font-weight: 800; }
    .waybill-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 0; }
    .meta-label { color: #8a94a4; font-size: 9px; }
    .meta-value { margin-top: 4px; color: #344054; font-size: 11px; font-weight: 700; }
    .signature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 25px; }
    .signature { min-height: 60px; padding-top: 8px; border-top: 1px solid #d6dbe3; color: #667085; font-size: 9px; text-align: center; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 150;
      max-width: min(370px, calc(100vw - 40px));
      padding: 11px 14px;
      border-radius: 9px;
      color: #fff;
      background: #26364f;
      box-shadow: var(--shadow);
      font-size: 11px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    tr[hidden] { display: none; }

    #sidebarBackdrop { display: none; }

    @media (max-width: 1050px) {
      .app-shell { grid-template-columns: 224px minmax(0, 1fr); }
      .main { padding: 26px 22px 36px; }
      .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dashboard-grid { grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); }
      .topbar { padding: 0 22px; }
    }

    @media (max-width: 760px) {
      .app-shell { display: block; }
      .sidebar {
        position: fixed;
        left: 0;
        width: 252px;
        transform: translateX(-102%);
        transition: transform .22s ease;
      }

      .sidebar.open { transform: translateX(0); }
      #sidebarBackdrop.show {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: block;
        background: rgba(13, 24, 42, .35);
      }

      .menu-toggle { display: inline-grid; place-items: center; }
      .topbar { height: 62px; padding: 0 14px; }
      .search-box { width: min(210px, 39vw); }
      .user-name { display: none; }
      .topbar-right { gap: 8px; }
      .main { padding: 22px 14px 32px; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .page-heading h1 { font-size: 23px; }
      .actions { width: 100%; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .stat-grid { gap: 9px; }
      .stat-card { min-height: 123px; padding: 12px; }
      .stat-value { font-size: 22px; }
      .stat-label { font-size: 10px; }
      .card { padding: 14px; }
      .table-card { padding: 0; }
      .table-card-header { padding: 14px; }
      .actions .btn { flex: 1; padding: 0 8px; font-size: 10px; }
      .demo-pill { display: none; }
      .field-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .ship-line { grid-template-columns: minmax(0, 1fr) 82px 32px; }
      .waybill { padding: 13px; }
      .waybill-no { font-size: 15px; }
      .modal { padding: 16px; }
      .chart-plot { height: 160px; }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <div class="brand-title">Gudang & Distribusi</div>
          <div class="brand-subtitle">Sistem manajemen stok</div>
        </div>
      </div>

      <div class="nav-label">MENU UTAMA</div>
      <nav class="nav-list">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">▦</span>Ringkasan</button>
        <button class="nav-link" data-page="inventory"><span class="nav-icon">▣</span>Barang & stok</button>
        <button class="nav-link" data-page="shipments"><span class="nav-icon">⇄</span>Pengiriman</button>
        <button class="nav-link" data-page="incoming"><span class="nav-icon">⇩</span>Barang masuk</button>
        <button class="nav-link" data-page="stocktake"><span class="nav-icon">☷</span>Stock opname</button>
        <button class="nav-link" data-page="reports"><span class="nav-icon">▤</span>Laporan</button>
      </nav>

      <div class="nav-label">PENGELOLAAN</div>
      <nav class="nav-list">
        <button class="nav-link" data-page="branches"><span class="nav-icon">⌖</span>Cabang & staging</button>

    function splitCsvLine(line, delimiter) {
      const result = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"' && quoted && line[i + 1] === '"') {
          value += '"';
          i++;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === delimiter && !quoted) {
          result.push(value);
          value = "";
        } else {
          value += char;
        }
      }

      result.push(value);
      return result;
    }

    function parseCsv(text) {
      const clean = text.replace(/^\uFEFF/, "");
      const firstLine = clean.split(/\r?\n/)[0] || "";
      const delimiter = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ";" : ",";

      return clean
        .split(/\r?\n/)
        .filter(line => line.trim() !== "")
        .map(line => splitCsvLine(line, delimiter));
    }

    async function readSpreadsheet(file) {
      const extension = file.name.split(".").pop().toLowerCase();

      if (extension === "csv") {
        return parseCsv(await file.text());
      }

      if (!window.XLSX) {
        throw new Error("Pembaca Excel belum tersedia. Pastikan perangkat terhubung ke internet, lalu muat ulang halaman.");
      }

      const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
    }

    function normalizeHeader(value) {
      return String(value ?? "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function parseQuantity(value) {
      if (value === null || value === undefined || String(value).trim() === "") return 0;
      let text = String(value).trim().replace(/\s/g, "");

      if (text.includes(",") && !text.includes(".")) text = text.replace(",", ".");
      else text = text.replace(/,/g, "");

      return Number(text);
    }

    function validateSpreadsheet(rows) {
      const nonEmptyRows = rows.filter(row => row.some(cell => String(cell ?? "").trim() !== ""));
      if (nonEmptyRows.length < 2) throw new Error("File belum berisi baris data.");

      const headers = nonEmptyRows[0].map(normalizeHeader);
      const hubIndex = headers.indexOf("hub");
      const stagingIndex = headers.indexOf("staging");

      if (hubIndex < 0 || stagingIndex < 0) {
        throw new Error("Kolom HUB dan STAGING wajib tersedia pada baris pertama.");
      }

      const productIndexes = products.map(product => headers.indexOf(normalizeHeader(product.name)));
      const missingProducts = products
        .filter((product, index) => productIndexes[index] < 0)
        .map(product => product.name);

      const entries = nonEmptyRows.slice(1).map(row => {
        const hub = String(row[hubIndex] ?? "").trim();
        const staging = String(row[stagingIndex] ?? "").trim();
        let total = 0;
        let itemCount = 0;
        const errors = [];

        if (!hub) errors.push("HUB kosong");
        if (!staging) errors.push("STAGING kosong");

        products.forEach((product, index) => {
          const columnIndex = productIndexes[index];
          if (columnIndex < 0) return;

          const rawValue = row[columnIndex];
          const quantity = parseQuantity(rawValue);

          if (!Number.isFinite(quantity) || quantity < 0 || !Number.isInteger(quantity)) {
            errors.push(`Jumlah ${product.name} harus berupa angka bulat 0 atau lebih`);
            return;
          }

          if (quantity > 0) {
            total += quantity;
            itemCount++;
          }
        });

        if (itemCount === 0) errors.push("Tidak ada jumlah barang di atas 0");
        return { hub, staging, total, itemCount, errors };
      });

      return { entries, missingProducts };
    }

    function renderImportPreview(result, filename) {
      const validCount = result.entries.filter(entry => entry.errors.length === 0).length;
      const totalUnits = result.entries.reduce((sum, entry) => sum + entry.total, 0);
      const missingText = result.missingProducts.length
        ? `<div class="warning-copy"><strong>Kolom barang belum ditemukan:</strong> ${escapeHtml(result.missingProducts.join(", "))}</div>`
        : "";

      const rows = result.entries.slice(0, 8).map(entry => `
        <tr>
          <td>${escapeHtml(entry.hub || "—")}</td>
          <td>${escapeHtml(entry.staging || "—")}</td>
          <td>${numberFormat.format(entry.itemCount)}</td>
          <td>${numberFormat.format(entry.total)}</td>
          <td class="${entry.errors.length ? "preview-status-bad" : "preview-status-good"}">${entry.errors.length ? "Perlu dicek" : "Siap"}</td>
        </tr>
      `).join("");

      document.getElementById("importResult").innerHTML = `
        <div class="result-box">
          <div class="result-title">File terbaca: ${escapeHtml(filename)}</div>
          <p class="result-copy">
            ${result.entries.length} baris tujuan · ${validCount} baris siap diperiksa ·
            total ${numberFormat.format(totalUnits)} unit pada data contoh.
          </p>
          ${missingText}
          ${result.entries.length > 8 ? `<p class="result-copy">Pratinjau menampilkan 8 baris pertama.</p>` : ""}
          <div class="table-scroll">
            <table class="preview-table">
              <thead><tr><th>HUB</th><th>STAGING</th><th>Jenis barang</th><th>Total unit</th><th>Pemeriksaan</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <p class="warning-copy">Ini hanya pratinjau prototipe. Data belum disimpan atau mengurangi stok gudang.</p>
        </div>
      `;
    }

    async function handleExcelFile(file) {
      if (!file) return;

      const resultBox = document.getElementById("importResult");
      resultBox.innerHTML = `<div class="result-box"><div class="result-title">Membaca file...</div></div>`;

      try {
        const rows = await readSpreadsheet(file);
        const result = validateSpreadsheet(rows);
        renderImportPreview(result, file.name);
      } catch (error) {
        resultBox.innerHTML = `
          <div class="result-box">
            <div class="result-title">File belum dapat diproses</div>
            <p class="result-copy">${escapeHtml(error.message || "Periksa format file dan nama kolom.")}</p>
          </div>
        `;
      }
    }

    function addShipmentLine() {

      const row = document.createElement("div");
      row.className = "ship-line";
      row.innerHTML = `
        <select class="ship-product" required>
          <option value="">Pilih barang</option>
          ${products.map(product => `
            <option value="${escapeHtml(product.name)}">${escapeHtml(product.name)} — stok demo ${numberFormat.format(product.stock)}</option>
          `).join("")}
        </select>
        <input class="ship-qty" type="number" min="1" step="1" placeholder="Jumlah" required>
        <button class="remove-line" type="button" data-action="remove-line" aria-label="Hapus barang">×</button>
      `;
      container.appendChild(row);
    }

    function openShipmentModal() {

              <div class="prototype-note">Simulasi ini hanya mengubah angka selama halaman terbuka. Data akan kembali ke contoh awal setelah halaman dimuat ulang.</div>

              <div class="modal-actions">
                <button class="btn btn-secondary" type="button" data-action="close-modal">Batal</button>

    function renderWaybillModal(shipment) {
      const lines = shipment.lines.map(line => `
        <tr>
          <td>${escapeHtml(line.name)}</td>
          <td style="text-align:right">${numberFormat.format(line.qty)} unit</td>
        </tr>
      `).join("");

      document.getElementById("modalRoot").innerHTML = `
        <div class="modal-backdrop" id="modalBackdrop">
          <section class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
              <div>
                <p class="eyebrow">SURAT JALAN</p>
                <h2>Pengiriman berhasil dicatat</h2>
              </div>
              <button class="modal-close" data-action="close-modal" aria-label="Tutup">×</button>
            </div>

            <div class="waybill">
              <div class="waybill-top">
                <div>
                  <div class="waybill-label">NOMOR SURAT JALAN</div>
                  <div class="waybill-no">${escapeHtml(shipment.number)}</div>
                </div>
                <span class="status-badge status-info">Dalam perjalanan</span>
              </div>

              <div class="waybill-meta">
                <div><div class="meta-label">Tanggal</div><div class="meta-value">${formatDate(shipment.date)}</div></div>
                <div><div class="meta-label">Resi / AWB</div><div class="meta-value">${escapeHtml(shipment.awb || "—")}</div></div>
                <div><div class="meta-label">HUB / area</div><div class="meta-value">${escapeHtml(shipment.hub)}</div></div>
                <div><div class="meta-label">STAGING / cabang</div><div class="meta-value">${escapeHtml(shipment.staging)}</div></div>
              </div>

              <div class="table-scroll">
                <table>
                  <thead><tr><th>Nama barang</th><th style="text-align:right">Jumlah</th></tr></thead>
                  <tbody>${lines}</tbody>
                </table>
              </div>

              <div class="signature-grid">
                <div class="signature">Disiapkan oleh</div>
                <div class="signature">Pengirim</div>
                <div class="signature">Penerima</div>
              </div>
            </div>

            <div class="prototype-note">Surat jalan ini adalah pratinjau prototipe. Format final dapat disesuaikan dengan kebutuhan perusahaan.</div>
            <div class="modal-actions">
              <button class="btn btn-secondary" data-action="close-modal">Tutup</button>
              <button class="btn btn-primary" data-action="print-waybill" data-number="${escapeHtml(shipment.number)}">▣ Cetak surat jalan</button>
            </div>
          </section>
        </div>
      `;
    }

    function submitShipment(form) {
      const errorBox = document.getElementById("shipmentError");
      const hub = form.elements.hub.value.trim();
      const staging = form.elements.staging.value.trim().toUpperCase();
      const awb = form.elements.awb.value.trim();
      const selectedLines = [...form.querySelectorAll(".ship-line")].map(row => ({
        name: row.querySelector(".ship-product").value,
        qty: Number(row.querySelector(".ship-qty").value)
      }));

      const lineMap = new Map();
      for (const line of selectedLines) {
        if (!line.name || !Number.isInteger(line.qty) || line.qty < 1) {
          errorBox.textContent = "Pilih barang dan masukkan jumlah berupa angka bulat lebih dari 0.";
          return;
        }
        lineMap.set(line.name, (lineMap.get(line.name) || 0) + line.qty);
      }

      for (const [name, qty] of lineMap.entries()) {
        const product = products.find(item => item.name === name);
        if (!product || qty > product.stock) {
          errorBox.textContent = `Stok contoh ${name} tidak mencukupi. Stok tersedia: ${product ? numberFormat.format(product.stock) : 0} unit.`;
          return;
        }
      }

      const lines = [...lineMap.entries()].map(([name, qty]) => ({ name, qty }));
      lines.forEach(line => {
        const product = products.find(item => item.name === line.name);
        product.stock -= line.qty;
      });

      const shipment = {
        number: shipmentNo(nextShipmentSequence++),
        date: new Date().toISOString(),
        hub,
        staging,
        awb,
        lines,
        items: lines.length,
        qty: lines.reduce((sum, line) => sum + line.qty, 0),
        status: "Dalam perjalanan"
      };

      shipments.unshift(shipment);
      createdShipmentCount++;
      renderPage();
      renderWaybillModal(shipment);
    }

    function printWaybill(number) {
      const shipment = shipments.find(item => item.number === number);
      if (!shipment) return;

      const rows = shipment.lines.map(line => `
        <tr><td>${escapeHtml(line.name)}</td><td class="qty">${numberFormat.format(line.qty)} unit</td></tr>
      `).join("");

      const printWindow = window.open("", "_blank", "width=850,height=700");
      if (!printWindow) {
        showToast("Izinkan pop-up browser untuk mencetak surat jalan.");
        return;
      }

      printWindow.document.open();
      printWindow.document.write(`
        <!doctype html>
        <html lang="id">
        <head>
          <meta charset="utf-8">
          <title>${escapeHtml(shipment.number)}</title>
          <style>
            @page { size: A4; margin: 18mm; }
            body { color:#202b3c; font-family:Arial,sans-serif; font-size:12px; }
            h1 { margin:0; font-size:22px; letter-spacing:.08em; }
            .top { display:flex; justify-content:space-between; padding-bottom:15px; border-bottom:2px solid #26364f; }
            .company { color:#667085; font-size:11px; }
            .no { margin-top:7px; font-size:13px; font-weight:bold; }
            .meta { display:grid; grid-template-columns:1fr 1fr; gap:10px 30px; margin:20px 0; }
            .label { color:#667085; font-size:10px; }
            .value { margin-top:4px; font-weight:bold; }
            table { width:100%; border-collapse:collapse; margin-top:18px; }
            th,td { padding:10px; border:1px solid #b8c0cc; text-align:left; }
            th { background:#f2f4f7; }
            .qty { text-align:right; }
            .signatures { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:65px; }
            .sign { padding-top:8px; border-top:1px solid #9aa3af; text-align:center; }
          </style>
        </head>
        <body>
          <div class="top">
            <div><div class="company">GUDANG & DISTRIBUSI</div><div class="no">${escapeHtml(shipment.number)}</div></div>
            <h1>SURAT JALAN</h1>
          </div>
          <div class="meta">
            <div><div class="label">Tanggal</div><div class="value">${formatDate(shipment.date)}</div></div>
            <div><div class="label">Resi / AWB</div><div class="value">${escapeHtml(shipment.awb || "—")}</div></div>
            <div><div class="label">HUB / area tujuan</div><div class="value">${escapeHtml(shipment.hub)}</div></div>
            <div><div class="label">STAGING / cabang tujuan</div><div class="value">${escapeHtml(shipment.staging)}</div></div>
          </div>
          <table>
            <thead><tr><th>Nama barang</th><th class="qty">Jumlah</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="signatures">
            <div class="sign">Disiapkan oleh</div>
            <div class="sign">Pengirim</div>
            <div class="sign">Penerima</div>
          </div>
        </body>
        </html>
      `);
      printWindow.document.close();
      setTimeout(() => {
        printWindow.focus();
        printWindow.print();
      }, 350);
    }

    document.addEventListener("click", event => {
      if (event.target.id === "modalBackdrop") {
        closeModal();
        return;
      }

      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        setPage(pageButton.dataset.page);
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;

      const action = actionButton.dataset.action;

      if (action === "import") openImportModal();
      if (action === "new-shipment") openShipmentModal();
      if (action === "close-modal") closeModal();
      if (action === "download-template") downloadTemplate();
      if (action === "add-line") addShipmentLine();
      if (action === "print-waybill") printWaybill(actionButton.dataset.number);

      if (action === "remove-line") {
        const container = document.getElementById("shipLines");
        const row = actionButton.closest(".ship-line");
        if (container && row) {
          if (container.querySelectorAll(".ship-line").length > 1) row.remove();
          else {
            row.querySelector(".ship-product").value = "";
            row.querySelector(".ship-qty").value = "";
          }
        }
      }
    });

    document.addEventListener("submit", event => {
      if (event.target.id === "shipmentForm") {
        event.preventDefault();
        submitShipment(event.target);
      }
    });

    document.addEventListener("input", event => {
      if (event.target.id === "globalSearch") applyFilters();
    });

    document.addEventListener("change", event => {
      if (["stockFilter", "statusFilter", "hubFilter"].includes(event.target.id)) applyFilters();
      if (event.target.id === "excelFile") handleExcelFile(event.target.files[0]);
    });

    document.getElementById("menuToggle").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebarBackdrop").classList.toggle("show");
    });

    document.getElementById("sidebarBackdrop").addEventListener("click", () => {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarBackdrop").classList.remove("show");
    });

    renderPage();
  </script>
</body>
</html>
